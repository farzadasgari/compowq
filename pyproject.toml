[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "climate-extremes-wq"
version = "0.1.0"
description = "Impact of hydroclimatic extreme events on Sentinel-2-derived water quality parameters"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "scikit-learn>=1.3",
    "statsmodels>=0.14",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
]

# "src" is the top-level importable package (not a src/<pkgname> layout) so that
# `python -m src.<module>` and `from src.<module> import ...` both work directly.
[tool.setuptools]
packages = ["src"]
